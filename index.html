<style>
:root{
  --red:#bd302d;--pink:#f29aa6;--mint:#9bd6a6;--yellow:#f2c44f;
  --ink:#342722;--cream:#fff8ed;--panel:#fffdf8;--line:#2f2926;
  --pad-h:calc(max(8px,env(safe-area-inset-left)) + max(8px,env(safe-area-inset-right)));
  --pad-v:calc(max(8px,env(safe-area-inset-top)) + max(8px,env(safe-area-inset-bottom)));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  min-height:100vh;min-height:100dvh;background:#f7eadc;color:var(--ink);
  font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit}
img{display:block;pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.app{
  width:100%;height:100%;display:grid;place-items:center;padding:
  max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
  max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
}
.phone{
  position:relative;overflow:hidden;container-type:inline-size;
  width:min(460px,calc(100vw - var(--pad-h)),calc((100dvh - var(--pad-v)) * 460 / 860));
  aspect-ratio:460/860;
  border-radius:28px;background:var(--cream);box-shadow:0 18px 50px #8b604833;
  border:2px solid #ead7c3;isolation:isolate;
}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
.topbar{
  position:absolute;z-index:30;top:12px;left:14px;right:14px;display:flex;
  align-items:center;justify-content:space-between;pointer-events:none;
}
.brand{font-weight:900;letter-spacing:.12em;color:var(--red);font-size:13px}
.sound{
  pointer-events:auto;width:42px;height:42px;border:0;border-radius:50%;
  background:#fff;box-shadow:0 4px 12px #5d3a2622;font-size:19px;cursor:pointer;
}
.primary,.secondary{
  min-height:52px;border:0;border-radius:999px;padding:0 25px;font-weight:900;
  letter-spacing:.06em;cursor:pointer;box-shadow:0 7px 18px #71382d2a;
}
.primary{background:var(--red);color:#fff}
.secondary{background:#fff;border:2px solid #dfc7b3}
.primary:active,.secondary:active{transform:scale(.97)}

/* home */
.home{
  background:
    linear-gradient(#eef4f899,#eef4f833),
    url("asset/images/american-home-bathroom-bg-v2.png") center/cover no-repeat;
}
.room-ring{display:none}
.character-wrap{
  position:absolute;inset:0;overflow:hidden;
  animation:breathe 4s ease-in-out infinite;transform-origin:50% 70%;
}
.character{
  position:absolute;left:50%;top:23%;width:auto;height:88%;
  transform:translateX(-50%);object-fit:contain;
  filter:drop-shadow(0 12px 10px #3c506328);transition:none;
}
.character.idle{animation:idleFace 4s linear infinite}
.character.exhale{opacity:0;animation:exhaleFace 4s linear infinite}
.character.complete{display:none}
.home.is-complete .character-wrap{animation:none}
.home.is-complete .character.idle,.home.is-complete .character.exhale{display:none}
.home.is-complete .character.complete{display:block}
.smile-fx{
  position:absolute;z-index:4;left:50%;top:62.5%;width:104px;height:58px;
  transform:translate(-50%,-50%);display:none;pointer-events:none;
}
.home.is-complete .smile-fx{display:block}
.smile-sweep{
  position:absolute;left:23px;top:25px;width:58px;height:17px;border-radius:50%;overflow:hidden;
  transform:rotate(-2deg);
}
.smile-sweep::after{
  content:"";position:absolute;inset:-8px auto -8px -18px;width:13px;
  background:linear-gradient(90deg,transparent,#fff9,transparent);
  filter:blur(.4px);transform:skewX(-18deg);
  animation:smileSweep 2.8s ease-in-out infinite;
}
.smile-fx i{
  position:absolute;width:11px;height:11px;opacity:0;
  animation:smileSparkle 1.8s ease-in-out infinite;
}
.smile-fx i::before,.smile-fx i::after{
  content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:999px;
  box-shadow:0 0 5px #fff8;
}
.smile-fx i::before{width:3px;height:100%;transform:translate(-50%,-50%)}
.smile-fx i::after{width:100%;height:3px;transform:translate(-50%,-50%)}
.smile-fx i:nth-of-type(1){left:8px;top:18px;animation-delay:-.2s}
.smile-fx i:nth-of-type(2){right:7px;top:12px;animation-delay:-.8s;transform:scale(.72)}
.smile-fx i:nth-of-type(3){left:19px;bottom:2px;animation-delay:-1.25s;transform:scale(.62)}
.smile-fx i:nth-of-type(4){right:18px;bottom:0;animation-delay:-1.55s;transform:scale(.82)}
@keyframes smileSweep{
  0%,28%{transform:translateX(0);opacity:0}
  36%{opacity:.9}
  56%{transform:translateX(78px);opacity:.7}
  62%,100%{transform:translateX(78px);opacity:0}
}
@keyframes smileSparkle{
  0%,100%{opacity:0}
  35%{opacity:.95}
  58%{opacity:.35}
}
.breath{position:absolute;z-index:4;left:53%;top:52%;width:170px;height:120px;pointer-events:none}
.breath .cloud{
  position:absolute;left:8px;top:42px;width:42px;height:33px;border-radius:50%;
  background:#c9c96fc4;opacity:0;filter:blur(.25px);
  box-shadow:17px -11px 0 2px #d8d781bd,35px 2px 0 7px #c6c66ebd,16px 14px 0 5px #d2d27abd;
  animation:badBreath 4s ease-out infinite;
}
.breath .cloud:nth-child(2){animation-delay:.12s;transform:scale(.68)}
.breath .cloud:nth-child(3){animation-delay:.24s;transform:scale(.46)}
.breath .trail{
  position:absolute;left:0;top:58px;width:38px;height:12px;border-top:3px solid #b89d5b;
  border-radius:50%;opacity:0;animation:odorTrail 4s ease-out infinite;
}
.breath .trail.t2{top:70px;left:7px;width:31px;animation-delay:.1s}
.breath .curl{
  position:absolute;left:78px;top:18px;color:#88723f;font-size:27px;font-weight:900;
  opacity:0;animation:odorCurl 4s ease-out infinite;
}
.home.is-complete .breath{display:none}
.home-copy{position:absolute;z-index:8;left:20px;right:20px;bottom:22px;text-align:center}
.home:not(.is-complete) .home-copy h1,.home:not(.is-complete) .home-copy p{display:none}
.home-copy h1{font-size:30px;line-height:1;margin:0 0 8px}
.home-copy p{font-size:13px;margin:0 0 14px;color:#806e64}
.home.is-complete .home-copy h1,.home.is-complete .home-copy p{display:none}
.home-copy button{margin:4px}
.shop-product-cta{
  width:min(100%,360px);min-height:78px;margin:0 auto 9px!important;padding:6px 18px 6px 8px;
  display:flex;align-items:center;justify-content:flex-start;gap:13px;text-align:left;
  border:0;border-radius:24px;background:var(--red);color:#fff;
  box-shadow:0 9px 22px #71382d3d;cursor:pointer;overflow:hidden;isolation:isolate;
}
.shop-product-cta[hidden]{display:none}
.shop-product-cta .shop-thumb{
  flex:0 0 66px;width:66px;height:66px;border-radius:18px;background:#fff;
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px #eadbd2;overflow:hidden;
}
.shop-product-cta img{display:block;width:59px;height:59px;object-fit:contain;border-radius:13px}
.shop-product-cta .shop-copy{display:flex;min-width:0;flex-direction:column;gap:3px;line-height:1.08}
.shop-product-cta small{font-size:10px;font-weight:900;letter-spacing:.13em;color:#ffd9ce}
.shop-product-cta strong{font-size:17px;font-weight:950;letter-spacing:.035em;white-space:nowrap}
.shop-product-cta:active{transform:scale(.98)}
.result-fx{position:absolute;z-index:6;inset:10% 3% 18%;pointer-events:none;overflow:hidden}
.result-fx i{position:absolute;font-style:normal;opacity:0;animation:resultFloat 2.4s ease-in-out infinite}
.result-fx.mint i img{width:34px;height:34px;object-fit:contain}
@keyframes resultFloat{
  0%,100%{opacity:0;transform:translateY(18px) scale(.7) rotate(-8deg)}
  22%,70%{opacity:.9}
  75%{transform:translateY(-24px) scale(1.05) rotate(9deg)}
}
@keyframes breathe{0%,100%{transform:scale(1)}42%,58%{transform:scale(1.016)}68%{transform:scale(.998)}}
@keyframes idleFace{0%,62%,94%,100%{opacity:1}66%,90%{opacity:0}}
@keyframes exhaleFace{0%,62%,94%,100%{opacity:0}66%,90%{opacity:1}}
@keyframes badBreath{
  0%,64%{opacity:0;transform:translate(0,8px) scale(.45)}
  69%{opacity:.82}
  88%{opacity:.65}
  94%,100%{opacity:0;transform:translate(72px,-24px) scale(1.18)}
}
@keyframes odorTrail{
  0%,64%{opacity:0;transform:translateX(-8px) scaleX(.5)}
  69%,84%{opacity:.72}
  94%,100%{opacity:0;transform:translateX(42px) scaleX(1.2)}
}
@keyframes odorCurl{
  0%,70%{opacity:0;transform:translate(0,8px) rotate(-12deg)}
  76%,86%{opacity:.7}
  94%,100%{opacity:0;transform:translate(24px,-18px) rotate(14deg)}
}

/* game */
.game{background:linear-gradient(#f7e6dc,#fff8ef)}
.progress{position:absolute;z-index:20;top:62px;left:16px;right:16px;height:8px;border-radius:9px;background:#ead8ca;overflow:hidden}
.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--pink),var(--red));transition:width .3s ease}
.stage-label{position:absolute;z-index:20;top:80px;left:0;right:0;text-align:center;font-size:12px;font-weight:900;letter-spacing:.08em;color:#806d62}
.mouth{
  position:absolute;z-index:3;left:2%;right:2%;top:11%;height:70%;overflow:hidden;
  border:0;border-radius:24px;background:#f9ead7;
  box-shadow:0 12px 30px #7b443b33;touch-action:none;
}
.mouth-base{
  position:absolute;inset:0;width:100%;height:100%;object-fit:fill;object-position:center;
  pointer-events:none;filter:sepia(.18) saturate(1.08) brightness(.98);
  transition:filter .45s ease;
}
.mouth.granular-done .mouth-base{filter:sepia(.07) saturate(1.02) brightness(1.06)}
.mouth.clean .mouth-base{filter:sepia(.03) saturate(.96) brightness(1.05)}
.teeth{display:none}
.tooth{
  position:absolute;width:18%;height:35%;background:#e5c686;border:3px solid #5f493b;
  border-radius:12px 12px 45% 45%;box-shadow:inset 0 -9px 0 #c89d60;
  transition:background .35s,box-shadow .35s,filter .35s;
}
.tooth:nth-child(1){left:5%;top:0;transform:rotate(9deg)}
.tooth:nth-child(2){left:23%;top:-3%}
.tooth:nth-child(3){left:41%;top:-5%}
.tooth:nth-child(4){left:59%;top:-3%}
.tooth:nth-child(5){left:77%;top:0;transform:rotate(-9deg)}
.tooth:nth-child(6){left:12%;bottom:0;transform:rotate(171deg)}
.tooth:nth-child(7){left:30%;bottom:-3%;transform:rotate(180deg)}
.tooth:nth-child(8){left:48%;bottom:-4%;transform:rotate(180deg)}
.tooth:nth-child(9){left:66%;bottom:0;transform:rotate(189deg)}
.game.clean .tooth{background:#fff8da;box-shadow:inset 0 -4px 0 #f0dfb0;filter:brightness(1.08)}
.dirt{position:absolute;z-index:6;border-radius:48% 52% 42% 58%;background:#87501f;border:2px solid #5d3417;box-shadow:0 2px 0 #392116,0 0 0 5px #d9a64255;transition:opacity .25s,transform .25s}
.dirt.cleared{opacity:0;transform:scale(.2)}
.d1{left:13%;top:29%;width:25px;height:17px}.d2{left:25%;top:22%;width:20px;height:23px}
.d3{left:69%;top:22%;width:20px;height:23px}.d4{left:84%;top:30%;width:25px;height:17px}
.d5{left:10%;top:58%;width:23px;height:17px}.d6{left:21%;top:71%;width:24px;height:18px}
.d7{left:74%;top:71%;width:24px;height:18px}.d8{left:86%;top:57%;width:20px;height:17px}
.haze{
  position:absolute;z-index:5;inset:13% 5% 9%;border-radius:38%;
  background:
    radial-gradient(ellipse at 18% 30%,#c69a4155 0 8%,transparent 15%),
    radial-gradient(ellipse at 82% 34%,#c69a4155 0 8%,transparent 15%),
    radial-gradient(ellipse at 28% 77%,#d2ad5250 0 9%,transparent 16%),
    radial-gradient(ellipse at 72% 78%,#d2ad5250 0 9%,transparent 16%);
  mix-blend-mode:multiply;transition:opacity .35s;pointer-events:none;
}
.mouth.granular-done .haze{opacity:.48}
.haze.cleared{opacity:0}
.polish-canvas{
  position:absolute;z-index:9;inset:0;width:100%;height:100%;pointer-events:none;
  opacity:1;mix-blend-mode:normal;
}
.germ{display:none}
.germ.g1{left:29%;top:47%}.germ.g2{right:26%;top:52%;animation-delay:-.5s}
@keyframes wobble{50%{transform:translateY(-4px) rotate(8deg)}}
.mouth-guide{
  display:none!important;position:absolute;z-index:12;left:50%;top:47%;width:90px;height:36px;border:4px dashed #fff9;
  border-width:0 0 4px;border-radius:50%;transform:translate(-50%,-50%) rotate(-8deg);
  animation:guideMove 1.2s ease-in-out infinite;pointer-events:none;
}
.mouth-guide.hidden{display:none}
@keyframes guideMove{50%{transform:translate(-20%,-50%) rotate(7deg)}}
.tool-cursor{
  position:fixed;z-index:100;width:104px;height:164px;display:none;pointer-events:none;overflow:hidden;
  transform:translate(-30%,-20%) rotate(-16deg);transform-origin:30% 20%;
  filter:drop-shadow(0 8px 7px #2d1c1738);
}
.tool-cursor.show{display:block}
.tool-cursor.preview{display:block;opacity:.9;animation:toolHint 1.25s ease-in-out infinite}
@keyframes toolHint{
  0%,100%{transform:translate(-42%,-13%) rotate(-16deg)}
  50%{transform:translate(-10%,-13%) rotate(2deg)}
}
.wipe-head{
  position:absolute;left:0;top:0;width:104px;height:164px;border:0;background-position:top center;background-size:contain;
  background-repeat:no-repeat;
}
.wipe-head.granular{background-image:url("asset/images/game-tool-granular-two-fingers-v5.png")}
.wipe-head.granular::after{
  content:"";position:absolute;left:7%;top:3%;width:47%;height:79%;border-radius:46% 46% 22% 22%;pointer-events:none;
  background:
    radial-gradient(ellipse at 28% 38%,#744216 0 8%,transparent 17%),
    radial-gradient(ellipse at 63% 66%,#a66b25 0 11%,transparent 21%),
    radial-gradient(ellipse at 76% 27%,#83501c 0 7%,transparent 15%);
  opacity:var(--soil,0);filter:blur(.45px);transition:opacity .18s ease;
}
.wipe-head.pearl{background-image:url("asset/images/game-tool-pearl-two-fingers-v5.png")}
.finger{display:none}
.bottom-panel{position:absolute;z-index:15;left:12px;right:12px;bottom:12px;min-height:134px;border-radius:23px;background:#fffdf9eF;border:2px solid #ead5c4;box-shadow:0 9px 24px #714a3924;padding:18px 14px 14px;text-align:center}
.instruction{font-size:22px;font-weight:900;line-height:1.16;margin:0 0 12px}
.mini{font-size:13px;line-height:1.35;color:#876e61}
.mini:empty{display:none}
.bottom-panel .primary{display:block;margin:20px auto 0}
.bottom-panel.complete-panel .instruction{font-size:34px;margin-bottom:4px}
.bottom-panel.complete-panel .primary{margin-top:18px}
.bottom-panel.equip-panel{display:grid;place-items:center;padding:14px}
.bottom-panel.equip-panel .instruction{font-size:34px;margin:0}
.bottom-panel.action-panel{display:grid;place-items:center;padding:14px}
.bottom-panel.action-panel .instruction{font-size:34px;margin:0}
.mascot-guide{
  display:none;position:absolute;z-index:2;top:-24px;bottom:-24px;width:152px;pointer-events:none;
  background-image:url("asset/images/coco-didi-wipe-guides.png");background-repeat:no-repeat;background-size:auto 226px;
  filter:drop-shadow(0 4px 5px #64423820);opacity:.96;
}
.mascot-guide.coco{left:22px;background-position:left calc(50% - 10px)}
.mascot-guide.didi{right:22px;background-position:right calc(50% - 10px)}
.bottom-panel.equip-panel .mascot-guide,
.bottom-panel.granular-panel .mascot-guide.coco,
.bottom-panel.pearl-panel .mascot-guide.didi{display:block}
.bottom-panel .instruction,.bottom-panel .mini,.bottom-panel .primary{position:relative;z-index:3}
.bottom-panel.equip-panel .instruction{max-width:54%}
.bottom-panel.action-panel .instruction{max-width:58%}
.bottom-panel.turn-layout{min-height:154px;padding-top:19px}
.bottom-panel.turn-layout .instruction{margin-bottom:14px}
.bottom-panel.turn-layout .primary{margin-top:22px}

/* showcase */
.showcase{position:absolute;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#402f2b73;backdrop-filter:blur(6px)}
.showcase.show{display:flex}
.show-card{position:relative;width:86%;min-height:500px;background:#fff;border-radius:30px;padding:28px 20px 22px;text-align:center;box-shadow:0 20px 60px #2e17134d;overflow:hidden}
.show-card.is-selecting{min-height:0;padding:26px 18px 24px}
.show-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,var(--flavor,#f5c3cb) 0 13%,transparent 48%);opacity:.5}
.show-content{position:relative;z-index:2}
.jar{position:relative;width:190px;height:190px;margin:35px auto 18px}
.jar img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 16px #52352c2e)}
.flavor-title{font-size:29px;font-weight:900;margin:8px 0}.flavor-copy{font-size:14px;color:#715f56;margin-bottom:20px}
.dots{display:flex;justify-content:center;gap:8px;margin:8px 0 18px}.dots i{width:9px;height:9px;border-radius:50%;background:#dfd2c8}.dots i.on{background:var(--red);transform:scale(1.25)}
.flavor-fx{position:absolute;inset:0;pointer-events:none}.flavor-fx i{position:absolute;animation:floaty 2.2s ease-in-out infinite;font-style:normal;font-size:25px}
.flavor-fx i img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 4px #4f8b4638)}
.flavor-fx i:nth-child(1){left:10%;top:18%}.flavor-fx i:nth-child(2){right:8%;top:30%;animation-delay:-.8s}.flavor-fx i:nth-child(3){left:18%;bottom:22%;animation-delay:-1.3s}
@keyframes floaty{50%{transform:translateY(-16px) rotate(12deg)}}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.choice{
  min-width:0;border:3px solid transparent;border-radius:18px;background:#fff;padding:8px 4px 10px;min-height:150px;cursor:pointer;box-shadow:0 5px 14px #4a2e2317;
}
.choice .game-jar{
  display:block;position:relative;width:100%;max-width:76px;aspect-ratio:1/1;margin:10px auto 8px;
}
.choice .game-jar img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px #52352c26)}
.choice b{display:block;font-size:10px}.choice:active{transform:scale(.96)}

/* equip */
.equip-stage{position:absolute;inset:22.83cqw 3.91cqw 30cqw;display:grid;place-items:center}
.equip-hand{
  position:absolute;left:50%;bottom:-4.35cqw;width:61.96cqw;height:auto;transform:translateX(-50%);
  filter:drop-shadow(0 10px 12px #54332824);transition:opacity .18s ease;
}
.equip-hand.fitted-hand{opacity:0}
.equip-wipe{
  position:absolute;z-index:5;left:50%;top:11%;width:22.61cqw;height:auto;transform:translate(-50%,-50%);
  filter:drop-shadow(0 8px 10px #4d302b2a);pointer-events:auto;touch-action:none;cursor:grab;
}
.equip-stage::before{
  content:"";position:absolute;z-index:4;left:50%;top:25%;width:25.22cqw;height:12.61cqw;transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 29% 50%,transparent 4.35cqw,#d44a4638 4.57cqw 5cqw,transparent 5.22cqw),
    radial-gradient(circle at 72% 50%,transparent 4.35cqw,#d44a4638 4.57cqw 5cqw,transparent 5.22cqw);
  opacity:.55;transition:opacity .15s ease,filter .15s ease;pointer-events:none;
}
.equip-stage.align-ready::before{
  opacity:1;filter:drop-shadow(0 0 8px #39a965);
  background:
    radial-gradient(circle at 29% 50%,transparent 4.13cqw,#39a965 4.35cqw 5.22cqw,transparent 5.43cqw),
    radial-gradient(circle at 72% 50%,transparent 4.13cqw,#39a965 4.35cqw 5.22cqw,transparent 5.43cqw);
}
.equip-stage::after{
  content:"⇩";position:absolute;z-index:6;left:50%;top:17%;transform:translateX(-50%);

    const pearlAverage=owners.reduce((sum,i)=>sum+game.pearlWear[i],0)/owners.length;
    els.haze.style.opacity=String(Math.max(0,.48*(1-pearlAverage)));
    if(game.pearl.size>=owners.length)completeMouth();
  }
  els.progress.style.width=progressValue()+"%";
}
function completeMouth(){
  if(game.state!=="cleanPearl")return;game.state="mouthComplete";game.completed=true;els.shine.classList.add("show");
  renderPolishCanvas();
  const fx={
    unscented:{color:"#f29aa6",icons:["✦","✧","○"]},
    mint:{color:"#70c89a",icons:["🌿","✦","〰"]},
    peanutButter:{color:"#e4ad3f",icons:["🥜","✦","●"]}
  }[game.selected||"unscented"];
  els.sparkles.style.setProperty("--fx-color",fx.color);
  els.sparkles.innerHTML=Array.from({length:18},(_,i)=>`<i style="left:${5+Math.random()*90}%;top:${8+Math.random()*78}%;font-size:${17+Math.random()*20}px">${fx.icons[i%fx.icons.length]}</i>`).join("");
  sfx.complete();render();
}
document.addEventListener("click",e=>{
  const button=e.target.closest("button");
  if(button&&button!==els.sound&&!(button===els.continue&&game.state==="flipWipe"))playClickSound();
});
document.addEventListener("click",()=>{
  if(!game.muted){bgmStarted=true;syncBgm()}
},{once:true});
els.play.addEventListener("click",()=>{ensureAudio();warmGranularAudio();if(game.state==="home"){bgmStarted=true;syncBgm();setState("mouthIntro")}else reset()});
els.shop.addEventListener("click",()=>{
  const flavor=FLAVORS.find(f=>f.id===(game.selected||"unscented"))||FLAVORS[0];
  trackStep("ShopClick",{flavor:flavor.id});
  if(flavor.amazonUrl)location.href=flavor.amazonUrl;
});
els.continue.addEventListener("click",handleContinue);
els.sound.addEventListener("click",()=>{game.muted=!game.muted;els.sound.textContent=game.muted?"🔇":"🔊";if(game.muted){stopGranularScrub();stopPearlPolish();sideTurnAudio.pause();sideTurnAudio.currentTime=0}else ensureAudio();syncBgm()});
els.equipWipe.addEventListener("pointerdown",e=>{
  ensureAudio();game.dragging=true;game.pointerId=e.pointerId;equipDragStartY=e.clientY;equipAligned=false;
  const w=els.equipWipe.getBoundingClientRect();equipGrabOffsetX=w.left+w.width/2-e.clientX;equipGrabOffsetY=w.top+w.height/2-e.clientY;
  try{els.equipWipe.setPointerCapture(e.pointerId)}catch(_){ }e.preventDefault()
});
els.equipWipe.addEventListener("pointermove",e=>{
  if(!game.dragging||e.pointerId!==game.pointerId)return;
  const r=els.equipStage.getBoundingClientRect();equipLastX=e.clientX+equipGrabOffsetX-r.left;equipLastY=e.clientY+equipGrabOffsetY-r.top;
  const gateX=r.width*.5,gateY=r.height*.25;
  if(!equipAligned&&Math.abs(equipLastX-gateX)<r.width*.17&&Math.abs(equipLastY-gateY)<r.height*.112){
    equipAligned=true;equipLastX=gateX;els.equipStage.classList.add("align-ready");sfx.pop()
  }
  const insideFingerLane=equipAligned&&Math.abs(equipLastX-gateX)<r.width*.186;
  els.equipStage.classList.toggle("align-ready",insideFingerLane);
  els.equipWipe.style.left=equipLastX+"px";els.equipWipe.style.top=equipLastY+"px";
  e.preventDefault()
});
els.equipWipe.addEventListener("pointerup",e=>{
  if(e.pointerId!==game.pointerId)return;
  const r=els.equipStage.getBoundingClientRect(),gateX=r.width*.5,gateY=r.height*.25;
  const movedDown=equipDragStartY!==null&&e.clientY-equipDragStartY>45;
  const inFingerLane=Math.abs(equipLastX-gateX)<r.width*.186&&equipLastY>gateY+r.height*.083&&equipLastY<r.height*.56;
  game.dragging=false;game.pointerId=null;equipDragStartY=null;els.equipStage.classList.remove("align-ready");
  els.equipWipe.style.left="";els.equipWipe.style.top="";
  if(equipAligned&&movedDown&&inFingerLane)fitWipe();else{sfx.swipe();render()}
});
els.equipWipe.addEventListener("pointercancel",()=>{
  game.dragging=false;game.pointerId=null;equipDragStartY=null;equipAligned=false;els.equipStage.classList.remove("align-ready");
  els.equipWipe.style.left="";els.equipWipe.style.top="";render()
});
els.mouth.addEventListener("pointerdown",mouthPointerDown);els.mouth.addEventListener("pointermove",mouthPointerMove);els.mouth.addEventListener("pointerup",pointerUp);els.mouth.addEventListener("pointercancel",pointerUp);
els.mouth.addEventListener("pointerleave",()=>{if(!game.dragging&&["cleanGranular","cleanPearl"].includes(game.state))render()});
if(els.mouthBase.complete)initPolishCanvas();else els.mouthBase.addEventListener("load",initPolishCanvas,{once:true});
render();syncBgm();
})();
</script>
</body>
</html>
